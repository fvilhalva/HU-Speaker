services:
  hu-speaker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - type: tmpfs
        target: /tmp/hu-speaker-audio
        tmpfs:
          size: 500m  # Limite de 500MB em RAM para arquivos de áudio
    environment:
      - AUDIO_OUTPUT_DIR=/tmp/hu-speaker-audio
      - CLEANUP_TTL_MINUTES=5
      - CLEANUP_INTERVAL_SECONDS=300
      - ENABLE_CLEANUP=true