services:
  hu-speaker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8082:8082"
    volumes:
      - type: tmpfs
        target: /tmp/hu-speaker-audio
        tmpfs:
          size: 500m  # Limite de 500MB em RAM para arquivos de áudio
    environment:
      - AUDIO_OUTPUT_DIR=/tmp/hu-speaker-audio
      - CLEANUP_TTL_MINUTES=10
      - CLEANUP_INTERVAL_SECONDS=60
      - ENABLE_CLEANUP=true
    networks:
      - sga-net

networks:
  sga-net:
    external: true