[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "hu-speaker"
version = "0.0.5"
description = "HU Speaker - descrição completa no README"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Felipe Echeverria Vilhalva", email = "felipefelipevilhalva@gmail.com" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "piper-tts",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.0.0",
  # Kokoro TTS (segundo motor, Apache-2.0). torch é instalado em modo CPU
  # pelo Dockerfile (índice cpu) antes deste passo, para evitar o build CUDA.
  "kokoro>=0.9.2",
  "numpy>=1.26.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[project.scripts]
hu-speaker = "hu_speaker.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: chamar Depends()/Field() no default de parâmetro é o padrão idiomático
# do FastAPI, não um bug — por isso ignorado globalmente.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

# numpy (dependência transitiva do piper-tts) publica stubs com sintaxe de
# Python 3.12 (statement `type`), que o mypy no alvo 3.11 não consegue parsear.
# Como não usamos numpy diretamente, não seguimos seus imports.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# kokoro (motor TTS opcional) não publica type stubs; é importado de forma
# preguiçosa dentro da KokoroEngine.
[[tool.mypy.overrides]]
module = ["kokoro", "kokoro.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/hu_speaker"]
