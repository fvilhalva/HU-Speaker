[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "hu-speaker"
version = "0.0.5"
description = "HU Speaker - descrição completa no README"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Felipe Echeverria Vilhalva", email = "felipefelipevilhalva@gmail.com" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "piper-tts",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[project.scripts]
hu-speaker = "hu_speaker.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.hatch.build.targets.wheel]
packages = ["src/hu_speaker"]
